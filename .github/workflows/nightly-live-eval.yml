# Nightly evaluation against the REAL Azure models (plus "Run workflow" on demand).
#
# PR CI stays offline and deterministic; this job checks the deployed models:
#   0. settings check (no values printed) + one-call connection test, so a missing
#      setting or wrong endpoint fails in seconds, before spending tokens
#   1. offline gates (a broken build shouldn't spend model tokens)
#   2. golden-set eval + red team with the live RAG model (leakage must still be 0)
#   3. judge calibration of the live judge against human labels
#   4. RAGAS quality scores (report-only until a few nights of baseline exist)
# Steps 2-4 each run even if another of them fails, so one run shows the whole picture;
# the job is still red if any of them fails.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   secrets:   AZURE_OPENAI_API_KEY  (+ ANTHROPIC_FOUNDRY_API_KEY for setup A)
#   variables: RAG_LLM_PROVIDER (azure_openai = GPT-5 setup B [default], foundry = Claude setup A)
#              ANTHROPIC_FOUNDRY_RESOURCE (setup A only, e.g. foundry-ankit-resource)
#              AZURE_OPENAI_ENDPOINT, OPENAI_API_VERSION   (copy both from "Get code" on the gpt-5 deployment)
#              RAG_LLM_MODEL (gpt-5, or claude-opus-5-5), RAG_JUDGE_MODEL (gpt-5),
#              RAG_EMBEDDING_MODEL (text-embedding-3-small)
# Keyless alternative: Entra ID via azure/login + OIDC, see docs/06-azure-models.md.
name: Nightly live-model eval

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAG_LLM_PROVIDER: ${{ vars.RAG_LLM_PROVIDER || 'azure_openai' }}
      RAG_LLM_MODEL: ${{ vars.RAG_LLM_MODEL }}
      ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
      RAG_JUDGE_PROVIDER: azure_openai
      RAG_JUDGE_MODEL: ${{ vars.RAG_JUDGE_MODEL }}
      RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settings check (names only, values never printed)
        run: |
          required="RAG_LLM_MODEL RAG_JUDGE_MODEL RAG_EMBEDDING_MODEL AZURE_OPENAI_ENDPOINT OPENAI_API_VERSION AZURE_OPENAI_API_KEY"
          if [ "$RAG_LLM_PROVIDER" = "foundry" ]; then
            required="$required ANTHROPIC_FOUNDRY_RESOURCE ANTHROPIC_FOUNDRY_API_KEY"
          fi
          echo "RAG_LLM_PROVIDER=$RAG_LLM_PROVIDER"
          missing=0
          for name in $required; do
            if [ -n "${!name}" ]; then echo "set      $name"; else echo "MISSING  $name"; missing=1; fi
          done
          case "$AZURE_OPENAI_ENDPOINT" in
            ""|https://*) ;;
            *) echo "AZURE_OPENAI_ENDPOINT must start with https://"; missing=1 ;;
          esac
          if [ "$missing" = 1 ]; then
            echo "::error::Add the missing settings under Settings -> Secrets and variables -> Actions (secrets for keys, variables for the rest)."
            exit 1
          fi

      - name: Install live SDKs
        run: pip install pytest -r requirements-live.txt

      - name: Connection test (one call to each deployment)
        run: |
          python - <<'EOF'
          import os
          from safe_rag.llm import make_llm
          from openai import AzureOpenAI

          answer = make_llm().complete("Reply with the single word OK.", "", "Say OK.")
          print(f"RAG model ({os.environ['RAG_LLM_PROVIDER']} / {os.environ['RAG_LLM_MODEL']}): reachable, {len(answer)} chars")
          emb = AzureOpenAI().embeddings.create(model=os.environ["RAG_EMBEDDING_MODEL"], input="ping")
          print(f"Embeddings ({os.environ['RAG_EMBEDDING_MODEL']}): reachable, dim {len(emb.data[0].embedding)}")
          EOF

      - name: Offline gates
        id: offline
        run: |
          python -m pytest -q
          python -m safe_rag.eval
          python -m safe_rag.redteam

      - name: Install RAGAS (pinned)
        id: ragas_install
        run: pip install -r requirements-ragas.txt

      - name: Live golden-set eval (model from RAG_LLM_PROVIDER)
        if: ${{ !cancelled() && steps.offline.outcome == 'success' }}
        run: python -m safe_rag.eval --live --json | tee live-eval.json

      - name: Live red team (leaks must be 0 with the real model too)
        if: ${{ !cancelled() && steps.offline.outcome == 'success' }}
        run: python -m safe_rag.redteam --live | tee live-redteam.txt

      - name: Judge calibration (live judge vs human labels)
        if: ${{ !cancelled() && steps.offline.outcome == 'success' }}
        run: python -m safe_rag.judge | tee judge-calibration.txt

      - name: RAGAS (report-only; add --enforce once a baseline exists)
        if: ${{ !cancelled() && steps.offline.outcome == 'success' && steps.ragas_install.outcome == 'success' }}
        run: python eval/ragas_eval.py | tee ragas.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: live-eval-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            live-eval.json
            live-redteam.txt
            judge-calibration.txt
            ragas.txt
